# Plaintext Secret checked into git is fine only as a placeholder for local/demo
# clusters. Before using this against anything real, replace with sealed-secrets,
# SOPS, or an external secret manager (Vault, AWS Secrets Manager, etc.) instead
# of committing real credentials.
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: world-of-games
type: Opaque
stringData:
  POSTGRES_DB: wog
  POSTGRES_USER: wog
  POSTGRES_PASSWORD: changeme
