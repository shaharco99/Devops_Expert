apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: world-of-games
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: world-of-games
spec:
  replicas: 1
  strategy:
    # A rolling restart of a single-instance stateful Postgres would try to
    # spin up a second pod while the PVC (ReadWriteOnce) is still attached to
    # the first - it would stick Pending forever. Recreate tears the old pod
    # down first.
    type: Recreate
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:18-alpine
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef:
                name: postgres-credentials
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "$(POSTGRES_USER)"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "$(POSTGRES_USER)"]
            initialDelaySeconds: 15
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgres-data
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: world-of-games
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
