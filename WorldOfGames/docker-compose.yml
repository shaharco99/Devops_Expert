##run using docker-compose up -d
services:
  db:
    image: postgres:18-alpine
    container_name: score_db
    environment:
      - POSTGRES_DB=wog
      - POSTGRES_USER=wog
      - POSTGRES_PASSWORD=wog
    volumes:
      - score_db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wog"]
      interval: 5s
      timeout: 5s
      retries: 10
  score:
    build: .
    container_name: score_flask
    image: ${DOCKER_HUB_REPO:-shaharco1804/score_flask}:${imageVersion:-latest}
    ports:
      - "5000:5000"
    environment:
      - FLASK_RUN_HOST=0.0.0.0
      - FLASK_RUN_PORT=5000
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - POSTGRES_DB=wog
      - POSTGRES_USER=wog
      - POSTGRES_PASSWORD=wog
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    # Optional: uncomment for local development
    # volumes:
    #   - ./:/WorldOfGames
  tester:
    build:
      context: .
      dockerfile: Dockerfile.tester
    depends_on:
      score:
        condition: service_healthy

volumes:
  score_db:
    driver: local
